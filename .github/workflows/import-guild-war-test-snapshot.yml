name: Import Guild War snapshot to test D1

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type IMPORT_TEST_SNAPSHOT to import the authorized snapshot into test D1
        required: true
        type: string

permissions:
  contents: read

jobs:
  import:
    name: Validate and import into isolated D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: pathofmemories-guild-war-test
    steps:
      - name: Check out the approved migration branch
        uses: actions/checkout@v4
        with:
          ref: codex/guild-war-v2-foundation

      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "IMPORT_TEST_SNAPSHOT"

      - name: Generate validated import SQL
        run: node guild-war-v2/generate-import-sql.mjs

      - name: Import into isolated D1
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/generated-import.sql

      - name: Publish non-sensitive import summary
        run: |
          node -e "const r=require('./guild-war-v2/generated-import-report.json'); console.log('## Guild War test import\n\n- Statements applied: '+r.statements+'\n- Rows reviewed: '+Object.values(r.counts).reduce((a,b)=>a+b,0)+'\n- Rows requiring review: '+r.issueCount)" >> "$GITHUB_STEP_SUMMARY"
