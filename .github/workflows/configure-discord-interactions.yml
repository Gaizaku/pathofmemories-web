name: Configure Discord interaction public key

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CONFIGURE_DISCORD_INTERACTIONS to send the GitHub secret to Cloudflare
        required: true
        type: string

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require exact confirmation and a public key
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "CONFIGURE_DISCORD_INTERACTIONS"
          test -n "$DISCORD_PUBLIC_KEY"
      - name: Set Discord public key secret on Cloudflare Worker
        run: printf "%s" "$DISCORD_PUBLIC_KEY" | npx wrangler secret put DISCORD_PUBLIC_KEY
