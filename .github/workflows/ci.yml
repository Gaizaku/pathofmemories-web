name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test guild-war-v2/attendance.test.mjs
      - run: node --test guild-war-v2/import-plan.test.mjs
      - run: node --test guild-war-v2/import-preview.test.mjs
      - run: node --test guild-war-v2/registration-token.test.mjs
      - run: node --test guild-war-v2/read-api.test.mjs
      - run: node --test guild-war-v2/organizer-auth.test.mjs
