name: Provision Guild War production database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CREATE_PRODUCTION_DATABASE to create and import the production D1 database
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    name: Create and initialize Guild War production D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: pathofmemories-guild-war
    steps:
      - uses: actions/checkout@v4

      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "CREATE_PRODUCTION_DATABASE"

      - name: Refuse to reuse an existing production database
        run: |
          npx wrangler d1 list --json > databases.json
          node -e "const fs=require('fs');const dbs=JSON.parse(fs.readFileSync('databases.json','utf8'));if(dbs.some((db)=>db.name===process.env.DATABASE_NAME)){console.error('Production database already exists. Refusing to rerun initial provisioning.');process.exit(1)}"

      - name: Create production database
        run: npx wrangler d1 create "$DATABASE_NAME"

      - name: Apply Guild War foundation schema
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/001_registration.sql

      - name: Apply Guild War registration claims
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/002_registration_claims.sql

      - name: Apply team revision schema
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/003_team_revisions.sql

      - name: Apply organizer authentication schema
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/004_organizer_auth.sql

      - name: Apply team draft schema
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/005_team_drafts.sql

      - name: Apply team publication schema
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/006_team_publications.sql

      - name: Apply weekend registration schema
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/009_weekend_registration.sql

      - name: Generate approved Sep 12-13 import SQL
        run: node guild-war-v2/generate-import-sql.mjs import-snapshot-2026-09-12-13.json

      - name: Import approved Sep 12-13 data
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/generated-import.sql

      - name: Publish database identifier and import summary
        run: |
          npx wrangler d1 list --json > databases.json
          node -e "const fs=require('fs');const db=JSON.parse(fs.readFileSync('databases.json','utf8')).find((item)=>item.name===process.env.DATABASE_NAME);if(!db)throw new Error('Database not found after creation');const r=require('./guild-war-v2/generated-import-report.json');console.log('Production database created. Name: '+db.name+'. Database ID: '+(db.uuid||db.id));console.log('Imported statements: '+r.statements)" >> "$GITHUB_STEP_SUMMARY"
