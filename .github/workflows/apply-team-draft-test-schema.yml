name: Apply team draft test schema
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4552c1f83ce0ef754f497129133c124f17eb0bd9
      - name: Create private draft table in test database
        run: npx wrangler d1 execute 74cc2c58-2045-4143-b46d-cfc5db96da39 --remote --file=guild-war-v2/005_team_drafts.sql
