name: Apply Guild War test schema migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type APPLY_TEST_MIGRATION to update the isolated D1 test schema
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Add guest registration claims
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: pathofmemories-guild-war-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/guild-war-v2-foundation

      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "APPLY_TEST_MIGRATION"

      - name: Apply guest claim schema
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/002_registration_claims.sql
