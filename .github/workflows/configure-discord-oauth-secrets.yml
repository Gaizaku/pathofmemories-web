name: Configure Discord OAuth secrets

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CONFIGURE_DISCORD_OAUTH to send GitHub secrets to Cloudflare
        required: true
        type: string

permissions:
  contents: read

jobs:
  configure:
    name: Configure Worker OAuth secrets
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/guild-war-v2-foundation

      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "CONFIGURE_DISCORD_OAUTH"

      - name: Set Discord OAuth secrets on Cloudflare Worker
        run: |
          printf "%s" "$DISCORD_CLIENT_ID" | npx wrangler secret put DISCORD_CLIENT_ID
          printf "%s" "$DISCORD_CLIENT_SECRET" | npx wrangler secret put DISCORD_CLIENT_SECRET
