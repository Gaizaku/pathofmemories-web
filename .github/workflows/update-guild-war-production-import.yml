name: Update Guild War production import

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type UPDATE_PRODUCTION_IMPORT to refresh the approved Sep 12-13 data
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    name: Refresh production Guild War data
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: pathofmemories-guild-war
    steps:
      - uses: actions/checkout@v4

      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "UPDATE_PRODUCTION_IMPORT"

      - name: Generate validated import SQL
        run: node guild-war-v2/generate-import-sql.mjs import-snapshot-2026-09-12-13.json

      - name: Refresh approved production data
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/generated-import.sql

      - name: Publish import summary
        run: |
          node -e "const r=require('./guild-war-v2/generated-import-report.json'); console.log('## Production Guild War refresh\n\n- Statements applied: '+r.statements+'\n- Rows reviewed: '+Object.values(r.counts).reduce((a,b)=>a+b,0)+'\n- Rows requiring review: '+r.issueCount)" >> "$GITHUB_STEP_SUMMARY"
