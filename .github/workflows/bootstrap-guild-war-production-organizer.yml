name: Bootstrap Guild War production organizer

on:
  workflow_dispatch:
    inputs:
      discord_user_id:
        description: Discord User ID (17-20 digits)
        required: true
        type: string
      display_name:
        description: Organizer display name
        required: true
        type: string
      confirm:
        description: Type ADD_PRODUCTION_ORGANIZER
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISCORD_USER_ID: ${{ inputs.discord_user_id }}
      DISPLAY_NAME: ${{ inputs.display_name }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          test "$CONFIRM" = "ADD_PRODUCTION_ORGANIZER"
          [[ "$DISCORD_USER_ID" =~ ^[0-9]{17,20}$ ]]
          test -n "$DISPLAY_NAME"
          test "${#DISPLAY_NAME}" -le 64

      - name: Create organizer SQL
        run: |
          node -e 'const quote=(v)=>"'"+v.replaceAll("'","''")+"'"; console.log("INSERT INTO organizers (discord_user_id, display_name, enabled, created_at) VALUES ("+quote(process.env.DISCORD_USER_ID)+", "+quote(process.env.DISPLAY_NAME)+", 1, datetime('now')) ON CONFLICT(discord_user_id) DO UPDATE SET display_name=excluded.display_name, enabled=1;")' > organizer.sql

      - name: Add organizer to production D1
        run: npx wrangler d1 execute pathofmemories-guild-war --remote --file=organizer.sql
