name: Apply Discord organizer test schema

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type APPLY_ORGANIZER_AUTH_TEST to add organizer authentication tables
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Add organizer OAuth schema
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: pathofmemories-guild-war-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/guild-war-v2-foundation

      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "APPLY_ORGANIZER_AUTH_TEST"

      - name: Apply organizer authentication schema
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/004_organizer_auth.sql
