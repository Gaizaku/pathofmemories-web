name: Provision Guild War test database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CREATE_TEST_DATABASE to create the isolated D1 test database
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    name: Create and initialize isolated D1 database
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: pathofmemories-guild-war-test
    steps:
      - uses: actions/checkout@v4

      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = "CREATE_TEST_DATABASE"

      - name: Refuse to reuse an existing database
        run: |
          npx wrangler d1 list --json > databases.json
          node -e "const fs=require('fs');const dbs=JSON.parse(fs.readFileSync('databases.json','utf8'));if(dbs.some((db)=>db.name===process.env.DATABASE_NAME)){console.error('Test database already exists. Refusing to rerun an initial schema.');process.exit(1)}"

      - name: Create isolated test database
        run: npx wrangler d1 create "$DATABASE_NAME"

      - name: Apply initial Guild War schema
        run: npx wrangler d1 execute "$DATABASE_NAME" --remote --file=guild-war-v2/001_registration.sql

      - name: Publish database identifier
        run: |
          npx wrangler d1 list --json > databases.json
          node -e "const fs=require('fs');const db=JSON.parse(fs.readFileSync('databases.json','utf8')).find((item)=>item.name===process.env.DATABASE_NAME);if(!db)throw new Error('Database not found after creation');console.log('Guild War test database created. Name: '+db.name+'. Database ID: '+(db.uuid||db.id))" >> "$GITHUB_STEP_SUMMARY"
