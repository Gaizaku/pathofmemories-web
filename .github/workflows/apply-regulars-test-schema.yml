name: Apply Guild War regulars schema
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guild-war-regulars-schema
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add Guild War regular attendee controls
        run: npx wrangler d1 execute 74cc2c58-2045-4143-b46d-cfc5db96da39 --remote --file=guild-war-v2/008_regulars_management.sql
